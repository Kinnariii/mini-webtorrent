<!DOCTYPE html>

<html>
<head>
    <title>Mini Torrent App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }
        .box {
            margin-top: 50px;
            padding: 20px;
            background: white;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input {
            margin-top: 10px;
        }
    </style>
</head>
<body>

```
<div class="box">
    <h1>Mini Torrent App</h1>

    <h3>Upload File</h3>
    <form>
        <input type="file"><br>
        <button type="submit">Upload</button>
    </form>

    <h3>Download File</h3>
    <input type="text" placeholder="Enter file name"><br>
    <button>Download</button>

    <h3>Progress</h3>
    <p id="progress">0%</p>
</div>
```

</body>
</html>
